name: publish

# Publishes a release to Visual Studio Marketplace and Open VSX when a version tag
# (e. g. "1.1.0", as created by "npm version") is pushed. Both registries use
# trusted publishing: the job's GitHub OIDC token is exchanged for a short-lived
# publish token, so no access token is stored in this repository.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Check that the tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

  publish-marketplace:
    needs: [tests, verify-version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          name: vscode-extension
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath vscode-fluid-language.vsix

  publish-open-vsx:
    needs: [tests, verify-version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          name: vscode-extension
      - name: Publish to Open VSX
        run: npx ovsx publish vscode-fluid-language.vsix --trusted-publishing
